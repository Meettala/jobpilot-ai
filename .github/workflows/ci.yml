name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Capture ESLint diagnostics
        run: |
          set +e
          npm run lint -- --format json > eslint-report.json 2>&1
          status=$?
          echo "$status" > eslint-status.txt
          exit 0

      - name: Upload ESLint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics
          path: |
            eslint-report.json
            eslint-status.txt
          retention-days: 3

      - name: Enforce ESLint
        run: test "$(cat eslint-status.txt)" -eq 0

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
